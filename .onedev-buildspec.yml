version: 47
jobs:
- name: test nova-lib
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: gomod cache
    key: gomod
    checksumFiles: go.sum
    paths:
    - .cache/gomod
    - .cache/gobuild
    uploadStrategy: UPLOAD_IF_NOT_EXACT_MATCH
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: vet build test
    runInContainer: true
    image: golang:1.25-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -eu
        export GOPROXY=https://goproxy.cn,direct
        export GOPRIVATE=git.xinpaiyun.cn
        export GOFLAGS=-p=2
        export GOMAXPROCS=2
        export GOMODCACHE="$PWD/.cache/gomod"
        export GOCACHE="$PWD/.cache/gobuild"
        mkdir -p "$GOMODCACHE" "$GOCACHE"
        go mod download
        go vet ./...
        go build ./...
        go test ./...
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Pve-Docker
  triggers:
  - type: BranchUpdateTrigger
    paths: '**.go go.mod go.sum'
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
